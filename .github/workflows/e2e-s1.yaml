name: E2E S1

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e-s1:
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Load the SCTP kernel module
        run: |
          sudo modprobe sctp || { sudo apt-get update && sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe sctp; }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the OCUDU gNB image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: e2e/ocudu
          build-args: OCUDU_COMMIT=690d1c25fc32053fec330b2c382571a95b66524f
          tags: ella-mocn-e2e/ocudu:690d1c25
          load: true
          cache-from: type=gha,scope=ocudu
          cache-to: type=gha,scope=ocudu,mode=max

      - name: Run the S1 lab
        env:
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
        run: |
          e2e/run.sh

      - name: Upload the lab logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-s1-logs
          path: e2e-artifacts/
          retention-days: 7
