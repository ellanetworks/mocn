name: Release workflow

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  check-version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against version/VERSION
        run: |
          version="$(cat version/VERSION)"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version/VERSION (${version})"
            exit 1
          fi
  image-build:
    needs: [check-version]
    uses: ./.github/workflows/image-build.yaml
  image-publish:
    needs: [image-build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-publish.yaml
    with:
      release: true
  image-build-ubi:
    needs: [check-version]
    uses: ./.github/workflows/image-build-ubi.yaml
  image-publish-ubi:
    needs: [image-build-ubi]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-publish.yaml
    with:
      release: true
      artifact: ellamocn-ubi-image
      tag-suffix: -ubi
  image-scan:
    needs: [image-publish]
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/image-scan.yaml
  chart-publish:
    needs: [image-publish]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/chart-publish.yaml
