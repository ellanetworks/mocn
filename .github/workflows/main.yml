name: Main workflow

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-unit-test:
    uses: ./.github/workflows/go-unittest.yaml
  go-lint:
    uses: ./.github/workflows/go-lint.yaml
  go-sec:
    uses: ./.github/workflows/go-sec.yaml
  ui-lint:
    uses: ./.github/workflows/ui-lint.yaml
  ui-typecheck:
    uses: ./.github/workflows/ui-typecheck.yaml
  ui-test:
    uses: ./.github/workflows/ui-test.yaml
  ui-e2e:
    uses: ./.github/workflows/ui-e2e.yaml
  image-build:
    uses: ./.github/workflows/image-build.yaml
  image-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-unit-test, go-lint, go-sec, ui-lint, ui-typecheck, ui-test, ui-e2e, image-build]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-publish.yaml
    with:
      release: false
