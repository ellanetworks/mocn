name: Main workflow

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-build:
    uses: ./.github/workflows/docs-build.yaml
  go-unit-test:
    uses: ./.github/workflows/go-unittest.yaml
  bench-smoke:
    uses: ./.github/workflows/bench-smoke.yaml
  go-lint:
    uses: ./.github/workflows/go-lint.yaml
  go-sec:
    uses: ./.github/workflows/go-sec.yaml
  gtpu-ebpf-tests:
    uses: ./.github/workflows/gtpu-ebpf-tests.yaml
  bpf-generate:
    uses: ./.github/workflows/bpf-generate.yaml
  clang-format:
    uses: ./.github/workflows/clang-format.yaml
  ui-lint:
    uses: ./.github/workflows/ui-lint.yaml
  ui-typecheck:
    uses: ./.github/workflows/ui-typecheck.yaml
  ui-test:
    uses: ./.github/workflows/ui-test.yaml
  ui-e2e:
    uses: ./.github/workflows/ui-e2e.yaml
  e2e-s1:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-s1.yaml
  image-build:
    uses: ./.github/workflows/image-build.yaml
  snap-build:
    uses: ./.github/workflows/snap-build.yaml
  snap-strict-test:
    needs: [snap-build]
    uses: ./.github/workflows/snap-strict-test.yaml
  chart-lint:
    uses: ./.github/workflows/chart-lint.yaml
  k8s-smoke:
    needs: [image-build]
    uses: ./.github/workflows/k8s-smoke.yaml
  image-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-unit-test, bench-smoke, go-lint, go-sec, gtpu-ebpf-tests, bpf-generate, clang-format, ui-lint, ui-typecheck, ui-test, ui-e2e, e2e-s1, image-build, chart-lint, k8s-smoke]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-publish.yaml
    with:
      release: false
  snap-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-unit-test, bench-smoke, go-lint, go-sec, gtpu-ebpf-tests, bpf-generate, clang-format, ui-lint, ui-typecheck, ui-test, ui-e2e, e2e-s1, snap-build, snap-strict-test]
    uses: ./.github/workflows/snap-publish.yaml
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
