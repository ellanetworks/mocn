openapi: "3.1.0"
info:
  title: Ella MOCN API
  version: "1.0.0"
  description: |
    Success: `{"result": <payload>}`. Error: `{"error": "message"}`.

servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:5030

security:
  - BearerAuth: []

tags:
  - name: Auth
  - name: Operators
  - name: Radios
  - name: UE connections
  - name: Users
  - name: Status
  - name: Metrics
  - name: Profiling
  - name: Specification

paths:
  /api/v1/init:
    post:
      tags: [Auth]
      operationId: initialize
      security: []
      summary: Create the first user
      description: >-
        Creates the first user, an admin, and logs it in. Until it is called, anyone who can reach the API can call it.
        It fails once a user exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitializeParams"
      responses:
        "201":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Log in
      description: >-
        Returns an access token, valid for 15 minutes, and sets the session cookie with which
        POST /api/v1/auth/refresh issues new ones. At most 20 attempts per minute per client address (IPv6 /64), and
        100 wrong passwords per hour per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginParams"
      responses:
        "200":
          $ref: "#/components/responses/Login"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security:
        - SessionCookie: []
      summary: Refresh the access token
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: []
      summary: Log out
      description: Ends the session of the cookie, if any, and clears the cookie.
      responses:
        "204":
          description: Logged out

  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getMyUser
      summary: Get my user
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/me/password:
    put:
      tags: [Users]
      operationId: updateMyPassword
      summary: Change my password
      description: >-
        Ends the sessions of the user, except the one of the session cookie the request carries: without that cookie,
        it ends all of them. A wrong current password counts as a failed login of the account. A user without a
        password gets a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyPasswordParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/users/me/api-tokens:
    get:
      tags: [Users]
      operationId: listMyAPITokens
      summary: List my API tokens
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          $ref: "#/components/responses/APITokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createMyAPIToken
      summary: Create an API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenParams"
      responses:
        "201":
          $ref: "#/components/responses/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/me/api-tokens/{id}:
    delete:
      tags: [Users]
      operationId: deleteMyAPIToken
      summary: Delete an API token
      parameters:
        - $ref: "#/components/parameters/APITokenID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/operators:
    get:
      tags: [Operators]
      operationId: listOperators
      summary: List operators
      description: Lists the operators, sorted by name.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListOperatorsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Operators]
      operationId: createOperator
      summary: Create operator
      description: Needs the Admin or Network Manager role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Operator"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/Operator"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/operators/{name}:
    get:
      tags: [Operators]
      operationId: getOperator
      summary: Get operator
      parameters:
        - $ref: "#/components/parameters/OperatorName"
      responses:
        "200":
          $ref: "#/components/responses/Operator"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Operators]
      operationId: updateOperator
      summary: Replace operator
      description: Replaces the whole operator. A different name renames it. Needs the Admin or Network Manager role.
      parameters:
        - $ref: "#/components/parameters/OperatorName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Operator"
      responses:
        "200":
          $ref: "#/components/responses/Operator"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Operators]
      operationId: deleteOperator
      summary: Delete operator
      description: Needs the Admin or Network Manager role.
      parameters:
        - $ref: "#/components/parameters/OperatorName"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/radios:
    get:
      tags: [Radios]
      operationId: listRadios
      summary: List radios
      description: Lists the radios with an S1 or NG association, oldest association first.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListRadiosResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/radios/{ref}:
    get:
      tags: [Radios]
      operationId: getRadio
      summary: Get a radio
      description: Gets a radio by its ref, which it has once its S1 Setup or NG Setup succeeds.
      parameters:
        - $ref: "#/components/parameters/RadioRef"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/Radio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/ue-connections:
    get:
      tags: [UE connections]
      operationId: listUEConnections
      summary: List UE connections
      description: Lists the UE-associated logical S1-connections and NG-connections that Ella MOCN relays, oldest first.
      parameters:
        - name: radio
          in: query
          description: Only the UE connections of the radio with this ref.
          schema:
            type: string
        - name: operator
          in: query
          description: Only the UE connections of the operator with this name.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListUEConnectionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ListUsersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserParams"
      responses:
        "201":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Get user
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200":
          $ref: "#/components/responses/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Users]
      operationId: updateUser
      summary: Change the role of a user
      description: >-
        A role change ends the sessions of the user. An admin cannot change its own role.
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete user
      description: >-
        Deletes the user with its sessions and API tokens. An admin cannot delete itself, and the last admin with
        a password cannot be deleted.
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/password:
    put:
      tags: [Users]
      operationId: updateUserPassword
      summary: Set the password of a user
      description: Ends the sessions of the user. An admin cannot set its own password here (403).
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordParams"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Users]
      operationId: deleteUserPassword
      summary: Remove the password of a user
      description: >-
        The user can then no longer sign in with a password. Ends the sessions of the user. The last admin with a
        password keeps it. 409 when the user has no password.
      parameters:
        - $ref: "#/components/parameters/Email"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/api-tokens:
    get:
      tags: [Users]
      operationId: listUserAPITokens
      summary: List the API tokens of a user
      parameters:
        - $ref: "#/components/parameters/Email"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          $ref: "#/components/responses/APITokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      operationId: createUserAPIToken
      summary: Create an API token for a user
      parameters:
        - $ref: "#/components/parameters/Email"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPITokenParams"
      responses:
        "201":
          $ref: "#/components/responses/CreatedAPIToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/users/{email}/api-tokens/{id}:
    delete:
      tags: [Users]
      operationId: deleteUserAPIToken
      summary: Delete an API token of a user
      parameters:
        - $ref: "#/components/parameters/Email"
        - $ref: "#/components/parameters/APITokenID"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/livez:
    get:
      tags: [Status]
      operationId: getLivez
      security: []
      summary: Check liveness
      description: >-
        Answers while the process serves HTTP.
      responses:
        "204":
          description: Live.

  /api/v1/readyz:
    get:
      tags: [Status]
      operationId: getReadyz
      security: []
      summary: Check readiness
      description: >-
        Answers whether the MOCN should receive traffic, with the result of each check.
      responses:
        "200":
          description: Every check passes.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResult"
        "503":
          description: A check fails.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResult"

  /api/v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      security: []
      summary: Get the status of the MOCN
      description: The version of the MOCN, and whether it is initialized.
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/Status"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      security: []
      summary: Get the metrics of the MOCN in the Prometheus formats
      responses:
        "200":
          description: >-
            The metrics, in the format the request's Accept header negotiates: the Prometheus protobuf format, with
            encoding delimited, text or compact-text, or else the Prometheus text format 0.0.4. The body is compressed
            with gzip when Accept-Encoding asks for it.
          content:
            text/plain:
              schema:
                type: string
            application/vnd.google.protobuf:
              schema:
                type: string
        "500":
          description: No metric could be gathered.
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: 32 requests already in flight, or gathering took more than 8 seconds.
          content:
            text/plain:
              schema:
                type: string

  /api/v1/pprof/:
    get:
      tags: [Profiling]
      operationId: getPprofIndex
      summary: Get pprof index
      description: The HTML page that lists the profiles.
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/allocs:
    get:
      tags: [Profiling]
      operationId: getPprofAllocs
      summary: Get the allocation profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
        - $ref: "#/components/parameters/PprofDelta"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/goroutine:
    get:
      tags: [Profiling]
      operationId: getPprofGoroutine
      summary: Get the goroutine profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
        - $ref: "#/components/parameters/PprofDelta"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/goroutineleak:
    get:
      tags: [Profiling]
      operationId: getPprofGoroutineLeak
      summary: Get the goroutine leak profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
        - $ref: "#/components/parameters/PprofDelta"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/heap:
    get:
      tags: [Profiling]
      operationId: getPprofHeap
      summary: Get the heap profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
        - $ref: "#/components/parameters/PprofGC"
        - $ref: "#/components/parameters/PprofDelta"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/threadcreate:
    get:
      tags: [Profiling]
      operationId: getPprofThreadcreate
      summary: Get the thread creation profile
      parameters:
        - $ref: "#/components/parameters/PprofDebug"
      responses:
        "200":
          $ref: "#/components/responses/PprofProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/cmdline:
    get:
      tags: [Profiling]
      operationId: getPprofCmdline
      summary: Get the command line
      description: The arguments of the process, separated by NUL bytes.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/profile:
    get:
      tags: [Profiling]
      operationId: getPprofCPUProfile
      summary: Get a CPU profile
      parameters:
        - name: seconds
          in: query
          description: Duration of the profile.
          schema:
            type: integer
            minimum: 1
            default: 30
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/PprofError"

  /api/v1/pprof/symbol:
    get:
      tags: [Profiling]
      operationId: getPprofSymbol
      summary: Get the number of symbols
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Profiling]
      operationId: postPprofSymbol
      summary: Resolve program counters to function names
      requestBody:
        description: Program counters in hexadecimal, separated by +.
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/pprof/trace:
    get:
      tags: [Profiling]
      operationId: getPprofTrace
      summary: Get an execution trace
      parameters:
        - name: seconds
          in: query
          description: Duration of the trace.
          schema:
            type: number
            exclusiveMinimum: 0
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/PprofError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/PprofError"

  /api/v1/openapi.yaml:
    get:
      tags: [Specification]
      operationId: getOpenAPISpec
      security: []
      summary: Get this specification
      responses:
        "200":
          description: The specification
          content:
            application/openapi+yaml: {}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        An access token from POST /api/v1/auth/login, or an API token, which starts with ellamocn_. An access token
        ends with its session. An API token cannot create API tokens, change a password, or manage users: those
        operations answer 403 to it.
    SessionCookie:
      type: apiKey
      in: cookie
      name: mocn_session
      description: >-
        The session that a login or the initialization starts, for POST /api/v1/auth/refresh. Over TLS, the cookie is
        __Host-mocn_session.

  parameters:
    Email:
      name: email
      in: path
      required: true
      schema:
        type: string
        format: email
    OperatorName:
      name: name
      in: path
      required: true
      schema:
        type: string
    RadioRef:
      name: ref
      in: path
      required: true
      description: >-
        <mcc>-<mnc>:<enb_id_type>:<enb_id> for an eNB, for example 001-01:macro:411.
        <mcc>-<mnc>:gnb<gnb_id_length>:<gnb_id> for a gNB, for example 001-01:gnb24:412.
      schema:
        type: string
    APITokenID:
      name: id
      in: path
      required: true
      description: The ID of the token, the part of it between ellamocn_ and the next underscore.
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PprofDebug:
      name: debug
      in: query
      description: 0 for the protobuf format, 1 for text, 2 for the goroutine stacks in the format of a panic.
      schema:
        type: integer
        enum: [0, 1, 2]
        default: 0
    PprofDelta:
      name: seconds
      in: query
      description: Returns the difference of the profile over this duration.
      schema:
        type: integer
        minimum: 1
    PprofGC:
      name: gc
      in: query
      description: Greater than 0 runs a garbage collection first.
      schema:
        type: integer
        default: 0
  schemas:
    ReadinessCheck:
      type: object
      required: [name, ok, detail]
      properties:
        name:
          type: string
          enum: [database]
          description: >-
            database: the database answers.
        ok:
          type: boolean
        detail:
          type: string
          description: Why the check fails. Empty when it passes.
    ReadinessResult:
      type: object
      required: [result]
      properties:
        result:
          type: object
          required: [ready, checks]
          properties:
            ready:
              type: boolean
              description: Whether every check passes.
            checks:
              type: array
              items:
                $ref: "#/components/schemas/ReadinessCheck"
    Status:
      type: object
      required: [version, revision, initialized]
      properties:
        version:
          type: string
          examples: [v0.0.1]
        revision:
          type: string
          description: Git commit of the build, empty in development builds.
        initialized:
          type: boolean
          description: Whether the first user exists. Until then, POST /api/v1/init creates it.
    LoginParams:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    InitializeParams:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          $ref: "#/components/schemas/Password"

    LoginResponse:
      type: object
      required: [message, token]
      properties:
        message:
          type: string
        token:
          type: string
          description: The access token, valid for 15 minutes.

    RefreshResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    SuccessResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Password:
      type: string
      description: 8 to 72 bytes.
      minLength: 8
      maxLength: 72

    RoleID:
      type: integer
      enum: [1, 2, 3]
      description: >-
        1 Admin: everything. 2 Read Only: reads the settings and the state of the MOCN. 3 Network Manager: also changes
        the settings, but does not manage users.

    User:
      type: object
      required: [email, role_id, role_pinned, password_set, oidc_linked]
      properties:
        email:
          type: string
          format: email
        role_id:
          $ref: "#/components/schemas/RoleID"
        role_pinned:
          type: boolean
          description: >-
            The role was set by an admin and will not be updated from identity provider groups. Stored, but without
            effect until single sign-on is supported.
        password_set:
          type: boolean
          description: The user can sign in with a password.
        oidc_linked:
          type: boolean
          description: Always false until single sign-on is supported.

    ListUsersResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    CreateUserParams:
      type: object
      required: [email, role_id]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 72
          anyOf:
            - const: ""
            - minLength: 8
          description: 8 to 72 bytes. Empty or missing for a user without a password.
        role_id:
          $ref: "#/components/schemas/RoleID"
        role_pinned:
          type: boolean
          description: Keeps the role from being updated from identity provider groups. Missing means false.

    UpdateUserParams:
      type: object
      required: [role_id]
      additionalProperties: false
      properties:
        role_id:
          $ref: "#/components/schemas/RoleID"
        role_pinned:
          type: boolean
          description: Keeps the role from being updated from identity provider groups. Missing keeps the current value.

    UpdatePasswordParams:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          $ref: "#/components/schemas/Password"

    UpdateMyPasswordParams:
      type: object
      required: [current_password, password]
      additionalProperties: false
      properties:
        current_password:
          type: string
        password:
          $ref: "#/components/schemas/Password"

    APIToken:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Absent for a token that does not expire.
        last_used_at:
          type: string
          format: date-time
          description: Absent for a token never used. Updated at most once a minute.

    ListAPITokensResponse:
      type: object
      required: [items, page, per_page, total_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/APIToken"
        page:
          type: integer
        per_page:
          type: integer
        total_count:
          type: integer

    CreateAPITokenParams:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
        expires_at:
          type: string
          format: date-time
          description: When the token expires. Without it, the token does not expire.

    CreateAPITokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token, ellamocn_ followed by its ID, an underscore and its secret.

    PLMN:
      type: object
      required: [mcc, mnc]
      additionalProperties: false
      properties:
        mcc:
          type: string
          pattern: "^[0-9]{3}$"
        mnc:
          type: string
          pattern: "^[0-9]{2,3}$"

    GlobalENBID:
      type: object
      required: [plmn, enb_id_type, enb_id]
      additionalProperties: false
      description: >-
        The eNB ID is 20 bits for macro, 18 for short_macro and 21 for long_macro. The PLMN must be one of the
        operator's PLMNs.
      properties:
        plmn:
          $ref: "#/components/schemas/PLMN"
        enb_id_type:
          type: string
          enum: [macro, short_macro, long_macro]
        enb_id:
          type: integer
          minimum: 0
          maximum: 2097151

    GlobalGNBID:
      type: object
      required: [plmn, gnb_id, gnb_id_length]
      additionalProperties: false
      description: The gNB ID is less than 2^gnb_id_length. The PLMN must be one of the operator's PLMNs.
      properties:
        plmn:
          $ref: "#/components/schemas/PLMN"
        gnb_id:
          type: integer
          minimum: 0
          maximum: 4294967295
        gnb_id_length:
          type: integer
          minimum: 22
          maximum: 32

    Operator:
      type: object
      required: [name, plmns]
      additionalProperties: false
      description: >-
        The responses have every property, with null for a missing global_enb_id or global_gnb_id and an empty list for
        no MMEs or AMFs.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Leading and trailing spaces are removed.
        pws_operator:
          type: boolean
          description: >-
            The operator whose core connects the common CBC. Its emergency warnings (PWS) are broadcast to every cell.
            At most one operator is the PWS operator. Missing means false.
        plmns:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          description: >-
            Operators with AMFs have at most 12 PLMNs in total. Operators with MMEs have at most 32 PLMNs in total.
          items:
            $ref: "#/components/schemas/PLMN"
        global_enb_id:
          oneOf:
            - $ref: "#/components/schemas/GlobalENBID"
            - type: "null"
        global_gnb_id:
          oneOf:
            - $ref: "#/components/schemas/GlobalGNBID"
            - type: "null"
        mmes:
          type: array
          description: >-
            Needs a global_enb_id. An address appears at most once across the operator's MMEs.
          items:
            $ref: "#/components/schemas/MME"
        amfs:
          type: array
          description: >-
            Needs a global_gnb_id. An address appears at most once across the operator's AMFs.
          items:
            $ref: "#/components/schemas/AMF"
        ue_connections:
          type: integer
          minimum: 0
          readOnly: true
          description: >-
            The number of UE-associated logical S1-connections and NG-connections across the operator's MMEs and AMFs.
            Present in GET responses. Ignored in requests.
        ue_connections_by_radio:
          type: array
          readOnly: true
          description: >-
            The number of UE-associated logical S1-connections and NG-connections of the operator on each radio. Lists every radio that
            broadcasts one of the operator's PLMNs, and every other radio with UE connections of the operator, sorted
            by name, or by ref for a radio without a name. Present in GET /api/v1/operators/{name} responses. Ignored in requests.
          items:
            $ref: "#/components/schemas/RadioUEConnections"

    MME:
      type: object
      required: [tnl_addresses]
      additionalProperties: false
      description: An MME, reached over one SCTP association to port 36412.
      properties:
        tnl_addresses:
          type: array
          minItems: 1
          uniqueItems: true
          description: IPv4 or IPv6 addresses, returned in canonical form.
          items:
            type: string
            anyOf:
              - format: ipv4
              - format: ipv6
        status:
          $ref: "#/components/schemas/MMEStatus"

    MMEStatus:
      type: object
      readOnly: true
      required: [state, since, ue_connections]
      description: >-
        Runtime state of the MME, learned from the S1 association and not stored. Present in GET responses for the MMEs
        of an operator with a global_enb_id. Ignored in requests.
      properties:
        state:
          type: string
          enum: [disconnected, connected, up, setup_failed]
          description: >-
            disconnected: no SCTP association. connected: SCTP association up, S1 Setup not completed. up: S1 Setup
            succeeded. setup_failed: the MME answered S1 SETUP FAILURE.
        since:
          type: string
          format: date-time
          description: When the MME entered its current state.
        primary_tnl_address:
          type: string
          description: The MME address the SCTP association currently sends to.
        mme_name:
          type: string
          description: MME Name from the S1 SETUP RESPONSE or MME CONFIGURATION UPDATE.
        served_gummeis:
          type: array
          description: Served GUMMEIs from the S1 SETUP RESPONSE or MME CONFIGURATION UPDATE.
          items:
            $ref: "#/components/schemas/ServedGUMMEIs"
        relative_mme_capacity:
          type: integer
          minimum: 0
          maximum: 255
        overload:
          type: array
          description: >-
            The GUMMEIs of the MME with an ongoing overload action, from OVERLOAD START and OVERLOAD STOP. Absent when
            none. Cleared when the S1 association is lost.
          items:
            $ref: "#/components/schemas/Overload"
        ue_connections:
          type: integer
          minimum: 0
          description: The number of UE-associated logical S1-connections relayed to the MME.

    AMF:
      type: object
      required: [tnl_addresses]
      additionalProperties: false
      description: An AMF, reached over one SCTP association to port 38412.
      properties:
        tnl_addresses:
          type: array
          minItems: 1
          uniqueItems: true
          description: IPv4 or IPv6 addresses, returned in canonical form.
          items:
            type: string
            anyOf:
              - format: ipv4
              - format: ipv6
        status:
          $ref: "#/components/schemas/AMFStatus"

    AMFStatus:
      type: object
      readOnly: true
      required: [state, since, ue_connections]
      description: >-
        Runtime state of the AMF, learned from the NG association and not stored. Present in GET responses for the AMFs
        of an operator with a global_gnb_id. Ignored in requests.
      properties:
        state:
          type: string
          enum: [disconnected, connected, up, setup_failed]
          description: >-
            disconnected: no SCTP association. connected: SCTP association up, NG Setup not completed. up: NG Setup
            succeeded. setup_failed: the AMF answered NG SETUP FAILURE.
        since:
          type: string
          format: date-time
          description: When the AMF entered its current state.
        primary_tnl_address:
          type: string
          description: The AMF address the SCTP association currently sends to.
        amf_name:
          type: string
          description: AMF Name from the NG SETUP RESPONSE or AMF CONFIGURATION UPDATE.
        served_guamis:
          type: array
          description: Served GUAMI List from the NG SETUP RESPONSE or AMF CONFIGURATION UPDATE.
          items:
            $ref: "#/components/schemas/GUAMI"
        plmn_support:
          type: array
          description: PLMN Support List from the NG SETUP RESPONSE or AMF CONFIGURATION UPDATE.
          items:
            $ref: "#/components/schemas/PLMNSupport"
        relative_amf_capacity:
          type: integer
          minimum: 0
          maximum: 255
        unavailable_guamis:
          type: array
          description: >-
            The GUAMIs that the AMF STATUS INDICATION marked unavailable. Not selected for UEs. Cleared by NG Setup and
            by an AMF CONFIGURATION UPDATE with a Served GUAMI List.
          items:
            $ref: "#/components/schemas/GUAMI"
        overload:
          $ref: "#/components/schemas/AMFOverload"
        ue_connections:
          type: integer
          minimum: 0
          description: The number of UE-associated logical NG-connections relayed to the AMF.

    GUAMI:
      type: object
      required: [plmn, amf_region_id, amf_set_id, amf_pointer]
      properties:
        plmn:
          $ref: "#/components/schemas/PLMN"
        amf_region_id:
          type: integer
          minimum: 0
          maximum: 255
        amf_set_id:
          type: integer
          minimum: 0
          maximum: 1023
        amf_pointer:
          type: integer
          minimum: 0
          maximum: 63

    SNSSAI:
      type: object
      required: [sst]
      properties:
        sst:
          type: integer
          minimum: 0
          maximum: 255
        sd:
          type: string
          pattern: "^[0-9a-f]{6}$"
          description: Absent when the S-NSSAI has no SD.

    PLMNSupport:
      type: object
      required: [plmn, snssais]
      properties:
        plmn:
          $ref: "#/components/schemas/PLMN"
        snssais:
          type: array
          items:
            $ref: "#/components/schemas/SNSSAI"

    AMFOverload:
      type: object
      description: >-
        The ongoing overload action of the AMF, from the last OVERLOAD START (TS 38.413 clause 9.2.6.14). Absent when
        none. Cleared by OVERLOAD STOP, NG Setup and the loss of the NG association.
      properties:
        overload_action:
          $ref: "#/components/schemas/AMFOverloadAction"
        traffic_load_reduction_indication:
          type: integer
          minimum: 1
          maximum: 99
          description: The percentage of the traffic to reject.
        slices:
          type: array
          description: Overload Start NSSAI List.
          items:
            type: object
            required: [snssais]
            properties:
              snssais:
                type: array
                items:
                  $ref: "#/components/schemas/SNSSAI"
              overload_action:
                $ref: "#/components/schemas/AMFOverloadAction"
              traffic_load_reduction_indication:
                type: integer
                minimum: 1
                maximum: 99

    AMFOverloadAction:
      type: string
      enum:
        - reject_non_emergency_mo_dt
        - reject_rrc_cr_signalling
        - permit_emergency_sessions_and_mobile_terminated_services_only
        - permit_high_priority_sessions_and_mobile_terminated_services_only
      description: Overload Action (TS 38.413 clause 9.3.1.105).

    Overload:
      type: object
      required: [gummei, overload_action]
      properties:
        gummei:
          $ref: "#/components/schemas/GUMMEI"
        overload_action:
          type: string
          enum:
            - reject_non_emergency_mo_dt
            - reject_rrc_cr_signalling
            - permit_emergency_sessions_and_mobile_terminated_services_only
            - permit_high_priority_sessions_and_mobile_terminated_services_only
            - reject_delay_tolerant_access
            - permit_high_priority_sessions_and_exception_reporting_and_mobile_terminated_services_only
            - not_accept_mo_data_or_delay_tolerant_access_from_cp_ciot
          description: Overload Action from the last OVERLOAD START that applies to the GUMMEI (TS 36.413 clause 9.2.3.20).
        traffic_load_reduction_indication:
          type: integer
          minimum: 1
          maximum: 99
          description: >-
            Traffic Load Reduction Indication from the same OVERLOAD START: the percentage of the traffic to reject
            (TS 36.413 clause 9.2.3.36). Absent when the MME did not include it.

    GUMMEI:
      type: object
      required: [plmn, mme_group_id, mme_code]
      properties:
        plmn:
          $ref: "#/components/schemas/PLMN"
        mme_group_id:
          type: integer
          minimum: 0
          maximum: 65535
        mme_code:
          type: integer
          minimum: 0
          maximum: 255

    ServedGUMMEIs:
      type: object
      required: [served_plmns, served_group_ids, served_mmecs]
      properties:
        served_plmns:
          type: array
          items:
            $ref: "#/components/schemas/PLMN"
        served_group_ids:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 65535
        served_mmecs:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 255

    TA:
      type: object
      required: [tac, broadcast_plmns]
      properties:
        tac:
          type: integer
          minimum: 0
          maximum: 16777215
          description: 16 bits on S1, 24 bits on NG.
        broadcast_plmns:
          type: array
          items:
            $ref: "#/components/schemas/PLMN"

    Radio:
      type: object
      required: [interface, supported_tas, state, connected_since, tnl_addresses, ue_connections]
      description: A radio with an S1 or NG association to Ella MOCN. Learned at runtime, not stored.
      properties:
        ref:
          type: string
          description: >-
            Identifies the radio in /api/v1/radios/{ref}. Set once the radio has a Global eNB ID or a Global gNB ID.
        interface:
          type: string
          enum: [s1, ng]
          description: "s1: an eNB. ng: a gNB."
        global_enb_id:
          description: From the S1 SETUP REQUEST. Absent for a gNB, before the radio sends one, or after it is rejected.
          type: object
          required: [plmn, enb_id_type, enb_id]
          properties:
            plmn:
              $ref: "#/components/schemas/PLMN"
            enb_id_type:
              type: string
              enum: [macro, home, short_macro, long_macro]
            enb_id:
              type: integer
              minimum: 0
        global_gnb_id:
          description: From the NG SETUP REQUEST. Absent for an eNB, before the radio sends one, or after it is rejected.
          $ref: "#/components/schemas/GlobalGNBID"
        enb_name:
          type: string
          description: eNB Name from the S1 SETUP REQUEST.
        ran_node_name:
          type: string
          description: RAN Node Name from the NG SETUP REQUEST.
        supported_tas:
          type: array
          items:
            $ref: "#/components/schemas/TA"
        default_paging_drx:
          type: integer
          enum: [32, 64, 128, 256]
          description: Radio frames.
        state:
          type: string
          enum: [connected, up]
          description: "connected: SCTP association up, no successful S1 or NG Setup. up: S1 or NG Setup succeeded."
        connected_since:
          type: string
          format: date-time
          description: When the SCTP association was established.
        tnl_addresses:
          type: array
          items:
            type: string
        ue_connections:
          type: integer
          minimum: 0
          description: The number of UE-associated logical S1-connections or NG-connections from the radio.
        ue_connections_by_operator:
          type: array
          description: >-
            The number of UE-associated logical S1-connections or NG-connections from the radio for each operator. Lists every operator
            that owns one of the PLMNs the radio broadcasts, and every other operator with UE connections from the
            radio, sorted by operator name. Present in GET /api/v1/radios/{ref} responses.
          items:
            $ref: "#/components/schemas/OperatorUEConnections"

    OperatorUEConnections:
      type: object
      required: [operator, ue_connections]
      properties:
        operator:
          type: string
          description: The operator name.
        ue_connections:
          type: integer
          minimum: 0

    RadioUEConnections:
      type: object
      required: [radio, ue_connections]
      properties:
        radio:
          type: string
          description: The radio ref.
        name:
          type: string
          description: The eNB name or RAN node name of the radio, if it sent one.
        ue_connections:
          type: integer
          minimum: 0

    ListRadiosResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Radio"

    TAI:
      type: object
      required: [plmn, tac]
      properties:
        plmn:
          $ref: "#/components/schemas/PLMN"
        tac:
          type: integer
          minimum: 0
          maximum: 16777215

    ECGI:
      type: object
      required: [plmn, cell_id]
      properties:
        plmn:
          $ref: "#/components/schemas/PLMN"
        cell_id:
          type: integer
          minimum: 0
          maximum: 268435455
          description: 28-bit E-UTRAN Cell Identity.

    NRCGI:
      type: object
      required: [plmn, cell_id]
      properties:
        plmn:
          $ref: "#/components/schemas/PLMN"
        cell_id:
          type: integer
          minimum: 0
          maximum: 68719476735
          description: 36-bit NR Cell Identity.

    UEConnection:
      type: object
      required: [interface, radio, operator, plmn, since, tai]
      description: >-
        A UE-associated logical S1-connection or NG-connection relayed by Ella MOCN. Learned at runtime, not stored.
      properties:
        interface:
          type: string
          enum: [s1, ng]
        radio:
          type: object
          required: [ref]
          description: >-
            The connection between the radio and Ella MOCN: the S1AP IDs over S1, the NGAP IDs over NG.
          properties:
            ref:
              type: string
              description: The radio's ref in /api/v1/radios/{ref}.
            enb_ue_s1ap_id:
              type: integer
              minimum: 0
              maximum: 16777215
              description: Allocated by the radio. S1 only.
            mme_ue_s1ap_id:
              type: integer
              minimum: 0
              maximum: 4294967295
              description: Allocated by Ella MOCN. S1 only.
            ran_ue_ngap_id:
              type: integer
              minimum: 0
              maximum: 4294967295
              description: Allocated by the radio. NG only.
            amf_ue_ngap_id:
              type: integer
              minimum: 0
              maximum: 1099511627775
              description: Allocated by Ella MOCN. NG only.
        mme:
          type: object
          required: [tnl_addresses, enb_ue_s1ap_id, mme_ue_s1ap_id]
          description: The S1 connection between Ella MOCN and the operator's MME. S1 only.
          properties:
            tnl_addresses:
              type: array
              items:
                type: string
              description: The MME's TNL addresses, as configured on the operator.
            enb_ue_s1ap_id:
              type: integer
              minimum: 0
              maximum: 16777215
              description: Allocated by Ella MOCN.
            mme_ue_s1ap_id:
              description: Allocated by the MME. Null until the MME's first message for the UE.
              oneOf:
                - type: integer
                  minimum: 0
                  maximum: 4294967295
                - type: "null"
        amf:
          type: object
          required: [tnl_addresses, ran_ue_ngap_id, amf_ue_ngap_id]
          description: The NG connection between Ella MOCN and the operator's AMF. NG only.
          properties:
            tnl_addresses:
              type: array
              items:
                type: string
              description: The AMF's TNL addresses, as configured on the operator.
            ran_ue_ngap_id:
              type: integer
              minimum: 0
              maximum: 4294967295
              description: Allocated by Ella MOCN.
            amf_ue_ngap_id:
              description: Allocated by the AMF. Null until the AMF's first message for the UE.
              oneOf:
                - type: integer
                  minimum: 0
                  maximum: 1099511627775
                - type: "null"
        operator:
          type: string
          description: The operator that serves the selected PLMN.
        plmn:
          $ref: "#/components/schemas/PLMN"
        since:
          type: string
          format: date-time
          description: When the radio sent the INITIAL UE MESSAGE.
        tai:
          description: The last TAI the radio reported for the UE.
          oneOf:
            - $ref: "#/components/schemas/TAI"
            - type: "null"
        ecgi:
          description: The last E-UTRAN CGI the radio reported for the UE. S1 only, absent when unknown.
          $ref: "#/components/schemas/ECGI"
        nr_cgi:
          description: The last NR CGI the radio reported for the UE. NG only, absent when unknown.
          $ref: "#/components/schemas/NRCGI"

    ListUEConnectionsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UEConnection"

    ListOperatorsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Operator"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    Unauthorized:
      description: Unauthorized
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PprofProfile:
      description: OK
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
        text/plain:
          schema:
            type: string
    PprofError:
      description: The error of a profiling path, in plain text.
      content:
        text/plain:
          schema:
            type: string
    TooManyRequests:
      description: Too Many Requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Login:
      description: Logged in. The response sets the mocn_session cookie.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/LoginResponse"
    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/SuccessResponse"
    Operator:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/Operator"
    User:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/User"
    APITokens:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/ListAPITokensResponse"
    CreatedAPIToken:
      description: Created. The response is the only time the token is shown.
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/CreateAPITokenResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicts with other settings
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: The request was cancelled while waiting to check the password.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
