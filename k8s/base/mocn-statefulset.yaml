apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ella-mocn
  labels:
    app.kubernetes.io/name: ella-mocn
    app.kubernetes.io/instance: ella-mocn
    app.kubernetes.io/part-of: ella
spec:
  replicas: 1
  serviceName: ella-mocn-internal
  selector:
    matchLabels:
      app.kubernetes.io/name: ella-mocn
      app.kubernetes.io/instance: ella-mocn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ella-mocn
        app.kubernetes.io/instance: ella-mocn
        app.kubernetes.io/part-of: ella
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: mocn
        image: ghcr.io/ellanetworks/ella-mocn:sha-c16805eb4a37
        command: ["mocn"]
        args: ["--config", "/config/mocn.yaml"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: http
          containerPort: 5030
        - name: s1
          containerPort: 36412
          protocol: SCTP
        startupProbe:
          httpGet:
            path: /api/v1/livez
            port: http
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 150
        readinessProbe:
          httpGet:
            path: /api/v1/readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/livez
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 1Gi
        volumeMounts:
        - name: config-volume
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config-volume
        configMap:
          name: mocn-config
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
