name: mocn-e2e

services:
  mongo:
    image: mongo:7.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      core:
        ipv4_address: 10.90.0.20

  provision:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./open5gs/provision.js:/provision.js:ro
    entrypoint: ["mongosh", "--quiet", "mongodb://10.90.0.20/open5gs", "/provision.js"]
    restart: "no"
    networks: [core]

  open5gs:
    image: gradiant/open5gs:2.7.6
    user: root
    privileged: true
    depends_on:
      provision:
        condition: service_completed_successfully
    entrypoint: ["/start.sh"]
    environment:
      DB_URI: mongodb://10.90.0.20/open5gs
      S1_ADDR: 10.90.0.10
      GTPU_ADDR: 10.90.1.10
      MCC: "001"
      MNC: "01"
      MME_GID: "2"
      MME_CODE: "1"
      TAC: "1"
      MME_NAME: open5gs-mme0
      UE_NET: "10.45"
    volumes:
      - ./open5gs/start.sh:/start.sh:ro
      - ./open5gs/config/open5gs:/config:ro
      - ./open5gs/config/freeDiameter:/etc/freeDiameter:ro
    networks:
      core:
        ipv4_address: 10.90.0.10
      ran:
        ipv4_address: 10.90.1.10

  open5gs-b:
    image: gradiant/open5gs:2.7.6
    user: root
    privileged: true
    depends_on:
      provision:
        condition: service_completed_successfully
    entrypoint: ["/start.sh"]
    environment:
      DB_URI: mongodb://10.90.0.20/open5gs_b
      S1_ADDR: 10.90.0.11
      GTPU_ADDR: 10.90.1.11
      MCC: "001"
      MNC: "02"
      MME_GID: "3"
      MME_CODE: "1"
      TAC: "1"
      MME_NAME: open5gs-b-mme0
      UE_NET: "10.46"
    volumes:
      - ./open5gs/start.sh:/start.sh:ro
      - ./open5gs/config/open5gs:/config:ro
      - ./open5gs/config/freeDiameter:/etc/freeDiameter:ro
    networks:
      core:
        ipv4_address: 10.90.0.11
      ran:
        ipv4_address: 10.90.1.11

  open5gs-5g:
    image: gradiant/open5gs:2.7.6
    user: root
    privileged: true
    depends_on:
      provision:
        condition: service_completed_successfully
    entrypoint: ["/start.sh"]
    environment:
      DB_URI: mongodb://10.90.0.20/open5gs
      NGAP_ADDR: 10.90.0.12
      GTPU_ADDR: 10.90.1.12
      MCC: "001"
      MNC: "01"
      AMF_REGION: "2"
      AMF_SET: "1"
      TAC: "1"
      AMF_NAME: open5gs-amf-a
      UE_NET: "10.47"
    volumes:
      - ./open5gs/start-5gc.sh:/start.sh:ro
      - ./open5gs/config/5gc:/config:ro
    networks:
      core:
        ipv4_address: 10.90.0.12
      ran:
        ipv4_address: 10.90.1.12

  open5gs-5g-b:
    image: gradiant/open5gs:2.7.6
    user: root
    privileged: true
    depends_on:
      provision:
        condition: service_completed_successfully
    entrypoint: ["/start.sh"]
    environment:
      DB_URI: mongodb://10.90.0.20/open5gs_b
      NGAP_ADDR: 10.90.0.13
      GTPU_ADDR: 10.90.1.13
      MCC: "001"
      MNC: "02"
      AMF_REGION: "3"
      AMF_SET: "2"
      TAC: "1"
      AMF_NAME: open5gs-amf-b
      UE_NET: "10.48"
    volumes:
      - ./open5gs/start-5gc.sh:/start.sh:ro
      - ./open5gs/config/5gc:/config:ro
    networks:
      core:
        ipv4_address: 10.90.0.13
      ran:
        ipv4_address: 10.90.1.13

  mocn:
    image: ella-mocn-e2e/mocn
    build:
      context: ..
      dockerfile: e2e/mocn/Dockerfile
    restart: unless-stopped
    command: ["--config", "/mocn.yaml"]
    volumes:
      - ./mocn/mocn.yaml:/mocn.yaml:ro
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:${E2E_API_PORT:-5032}:5030"
    networks:
      core:
        ipv4_address: 10.90.0.30
      ran:
        ipv4_address: 10.90.1.30

  srsenb:
    image: gradiant/srsran-4g:23_11
    privileged: true
    restart: unless-stopped
    depends_on: [mocn]
    command: ["enb", "--rf.device_args=tx_port=tcp://*:2000,rx_port=tcp://10.90.2.3:2001,id=enb,base_srate=23.04e6", "--log.all_level=warning", "--log.s1ap_level=info", "--log.rrc_level=info", "--log.filename=stdout"]
    environment:
      ENB_ID: "0x19B"
      MCC: "001"
      MNC: "01"
      TAC: "1"
      MME_ADDR: 10.90.1.30
      GTP_BIND_ADDR: 10.90.1.21
      S1C_BIND_ADDR: 10.90.1.21
      N_PRB: "50"
      TX_GAIN: "50"
      RX_GAIN: "40"
      ZMQ: "true"
      UE_ADDRESS: 10.90.2.3
    networks:
      ran:
        ipv4_address: 10.90.1.21
      radio:
        ipv4_address: 10.90.2.2

  srsue:
    image: gradiant/srsran-4g:23_11
    privileged: true
    restart: on-failure
    depends_on: [srsenb]
    command: ["ue", "--rf.device_args=tx_port=tcp://10.90.2.3:2001,rx_port=tcp://10.90.2.2:2000,id=ue,base_srate=23.04e6"]
    environment:
      ZMQ: "true"
      ENB_ADDRESS: 10.90.2.2
      UE_ADDRESS: 10.90.2.3
      ALGO: milenage
      KEY: 465b5ce8b199b49faa5f0a2ee238a6bc
      OPC: cd63cb71954a9f4e48a5994e37a02baf
      MCC: "001"
      MNC: "01"
      MSISDN: "0000000001"
      APN: internet
    networks:
      radio:
        ipv4_address: 10.90.2.3

  srsenb-b:
    image: gradiant/srsran-4g:23_11
    privileged: true
    restart: unless-stopped
    depends_on: [mocn]
    command: ["enb", "--rf.device_args=tx_port=tcp://*:2000,rx_port=tcp://10.90.2.5:2001,id=enb,base_srate=23.04e6", "--log.all_level=warning", "--log.s1ap_level=info", "--log.rrc_level=info", "--log.filename=stdout"]
    environment:
      ENB_ID: "0x19C"
      MCC: "001"
      MNC: "02"
      TAC: "1"
      MME_ADDR: 10.90.1.30
      GTP_BIND_ADDR: 10.90.1.22
      S1C_BIND_ADDR: 10.90.1.22
      N_PRB: "50"
      TX_GAIN: "50"
      RX_GAIN: "40"
      ZMQ: "true"
      UE_ADDRESS: 10.90.2.5
    networks:
      ran:
        ipv4_address: 10.90.1.22
      radio:
        ipv4_address: 10.90.2.4

  srsue-b:
    image: gradiant/srsran-4g:23_11
    privileged: true
    restart: on-failure
    depends_on: [srsenb-b]
    command: ["ue", "--rf.device_args=tx_port=tcp://10.90.2.5:2001,rx_port=tcp://10.90.2.4:2000,id=ue,base_srate=23.04e6"]
    environment:
      ZMQ: "true"
      ENB_ADDRESS: 10.90.2.4
      UE_ADDRESS: 10.90.2.5
      ALGO: milenage
      KEY: 465b5ce8b199b49faa5f0a2ee238a6bc
      OPC: cd63cb71954a9f4e48a5994e37a02baf
      MCC: "001"
      MNC: "02"
      MSISDN: "0000000002"
      APN: internet
    networks:
      radio:
        ipv4_address: 10.90.2.5

  srsgnb:
    image: gradiant/srsran-5g:24_10_1
    privileged: true
    restart: unless-stopped
    depends_on: [mocn]
    entrypoint: ["sh", "-c", "envsubst < /gnb.tmpl > /tmp/gnb.yml && exec /opt/srsRAN_Project/target/bin/gnb -c /tmp/gnb.yml"]
    environment:
      GNB_ID: "1"
      GNB_NAME: srsgnb-a
      PLMN: "00101"
      AMF_ADDR: 10.90.1.30
      GNB_ADDR: 10.90.1.23
      ZMQ_ADDR: 10.90.2.6
      UE_ADDR: 10.90.2.7
    volumes:
      - ./srsran/gnb.yml:/gnb.tmpl:ro
    networks:
      ran:
        ipv4_address: 10.90.1.23
      radio:
        ipv4_address: 10.90.2.6

  srsue-5g:
    image: gradiant/srsran-4g:23_11
    privileged: true
    restart: on-failure
    depends_on: [srsgnb]
    entrypoint: ["sh", "-c", "envsubst < /ue.tmpl > /tmp/ue.conf && exec srsue /tmp/ue.conf"]
    environment:
      IMSI: "001010000000011"
      ZMQ_ADDR: 10.90.2.7
      GNB_ADDR: 10.90.2.6
    volumes:
      - ./srsran/ue.conf:/ue.tmpl:ro
    networks:
      radio:
        ipv4_address: 10.90.2.7

  srsgnb-b:
    image: gradiant/srsran-5g:24_10_1
    privileged: true
    restart: unless-stopped
    depends_on: [mocn]
    entrypoint: ["sh", "-c", "envsubst < /gnb.tmpl > /tmp/gnb.yml && exec /opt/srsRAN_Project/target/bin/gnb -c /tmp/gnb.yml"]
    environment:
      GNB_ID: "2"
      GNB_NAME: srsgnb-b
      PLMN: "00102"
      AMF_ADDR: 10.90.1.30
      GNB_ADDR: 10.90.1.24
      ZMQ_ADDR: 10.90.2.8
      UE_ADDR: 10.90.2.9
    volumes:
      - ./srsran/gnb.yml:/gnb.tmpl:ro
    networks:
      ran:
        ipv4_address: 10.90.1.24
      radio:
        ipv4_address: 10.90.2.8

  srsue-5g-b:
    image: gradiant/srsran-4g:23_11
    privileged: true
    restart: on-failure
    depends_on: [srsgnb-b]
    entrypoint: ["sh", "-c", "envsubst < /ue.tmpl > /tmp/ue.conf && exec srsue /tmp/ue.conf"]
    environment:
      IMSI: "001020000000012"
      ZMQ_ADDR: 10.90.2.9
      GNB_ADDR: 10.90.2.8
    volumes:
      - ./srsran/ue.conf:/ue.tmpl:ro
    networks:
      radio:
        ipv4_address: 10.90.2.9

  ueransim:
    image: ghcr.io/ellanetworks/ueransim:3.2.7
    privileged: true
    depends_on: [mocn]
    entrypoint: ["sh", "-c", "nr-gnb --config /gnb.yaml >/tmp/gnb.log 2>&1 & sleep 3; exec nr-ue --config /ue.yaml"]
    volumes:
      - ./ueransim/gnb.yaml:/gnb.yaml:ro
      - ./ueransim/ue.yaml:/ue.yaml:ro
    networks:
      ran:
        ipv4_address: 10.90.1.25

networks:
  core:
    ipam:
      config:
        - subnet: 10.90.0.0/24
  ran:
    internal: true
    ipam:
      config:
        - subnet: 10.90.1.0/24
  radio:
    internal: true
    ipam:
      config:
        - subnet: 10.90.2.0/24
