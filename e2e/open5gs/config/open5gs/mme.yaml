logger:
  file:
    path: /var/log/open5gs/mme.log
mme:
  freeDiameter: /etc/freeDiameter/mme.conf
  s1ap:
    server:
      - address: ${S1_ADDR}
  gtpc:
    server:
      - address: 127.0.0.2
    client:
      sgwc:
        - address: 127.0.0.3
      smf:
        - address: 127.0.0.4
  gummei:
    - plmn_id:
        mcc: ${MCC}
        mnc: ${MNC}
      mme_gid: ${MME_GID}
      mme_code: ${MME_CODE}
  tai:
    - plmn_id:
        mcc: ${MCC}
        mnc: ${MNC}
      tac: ${TAC}
  security:
    integrity_order: [EIA2, EIA1, EIA0]
    ciphering_order: [EEA0, EEA1, EEA2]
  network_name:
    full: Open5GS
  mme_name: ${MME_NAME}
