name: ella-mocn-oidc-e2e

configs:
  mocn_config:
    content: |
      logging:
        level: info
      db:
        path: mocn.db
      api:
        address: 0.0.0.0
        port: 5030
        tls:
          cert: /certs/mocn.pem
          key: /certs/mocn-key.pem
      ran:
        signalling:
          address: 127.0.0.1
          s1_port: 36412
          ng_port: 38412

services:
  ella-mocn:
    image: ${ELLA_MOCN_IMAGE:-ella-mocn:latest}
    configs:
      - source: mocn_config
        target: /mocn.yaml
    entrypoint: /bin/mocn --config /mocn.yaml
    volumes:
      - ${ELLA_E2E_OIDC_DIR:-../.build/oidc}:/certs:ro
    ports:
      - "${ELLA_E2E_OIDC_PORT:-15443}:5030"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: https://keycloak:${KEYCLOAK_E2E_PORT:-18443}
      KC_HTTPS_PORT: ${KEYCLOAK_E2E_PORT:-18443}
      KC_HTTPS_CERTIFICATE_FILE: /certs/keycloak.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/keycloak-key.pem
      KC_HTTP_ENABLED: "false"
    volumes:
      - ${ELLA_E2E_OIDC_DIR:-../.build/oidc}:/certs:ro
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "${KEYCLOAK_E2E_PORT:-18443}:${KEYCLOAK_E2E_PORT:-18443}"
