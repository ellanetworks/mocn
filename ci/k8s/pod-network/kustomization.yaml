apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../namespace
  - ../../../k8s
images:
  - name: ghcr.io/ellanetworks/ella-mocn
    newName: ella-mocn
    newTag: ci
patches:
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: ella-mocn
      spec:
        type: NodePort
        externalTrafficPolicy: Local
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: ella-mocn-s1
      spec:
        type: NodePort
