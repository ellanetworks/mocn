apiVersion: v1
kind: Service
metadata:
  name: {{ include "ella-mocn.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ella-mocn.labels" . | nindent 4 }}
    ellanetworks.com/service: api
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ella-mocn.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if and .Values.service.nodePort (eq .Values.service.type "NodePort") }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
