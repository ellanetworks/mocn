apiVersion: v1
kind: Service
metadata:
  name: {{ include "ella-mocn.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ella-mocn.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "ella-mocn.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: 5030
      targetPort: http
