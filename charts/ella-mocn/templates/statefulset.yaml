apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ella-mocn.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ella-mocn.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "ella-mocn.headlessServiceName" . }}
  selector:
    matchLabels:
      {{- include "ella-mocn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ella-mocn.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "ella-mocn.config" . | sha256sum }}
        {{- with .Values.ran.address }}
        k8s.v1.cni.cncf.io/networks: {{ list (dict "name" (include "ella-mocn.networkAttachmentName" $) "interface" $.Values.ran.interface "ips" (list .)) | toJson | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ella-mocn.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- if .Values.userPlane.enabled }}
        runAsUser: 0
        runAsGroup: 0
        {{- else }}
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        {{- end }}
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mocn
          image: {{ include "ella-mocn.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["mocn"]
          args: ["--config", "/config/mocn.yaml"]
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              {{- if .Values.userPlane.enabled }}
              add: ["BPF", "PERFMON", "NET_ADMIN", "NET_RAW"]
              {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 5030
            - name: sctp-s1
              containerPort: 36412
              protocol: SCTP
            - name: sctp-ng
              containerPort: 38412
              protocol: SCTP
            {{- if .Values.userPlane.enabled }}
            - name: udp-gtpu
              containerPort: 2152
              protocol: UDP
            {{- end }}
          startupProbe:
            httpGet:
              scheme: {{ include "ella-mocn.apiScheme" . }}
              path: /api/v1/livez
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 150
          readinessProbe:
            httpGet:
              scheme: {{ include "ella-mocn.apiScheme" . }}
              path: /api/v1/readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: {{ include "ella-mocn.apiScheme" . }}
              path: /api/v1/livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            {{- if .Values.api.tls.secretName }}
            - name: api-tls
              mountPath: /tls/api
              readOnly: true
            {{- end }}
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.api.tls.secretName }}
        - name: api-tls
          secret:
            secretName: {{ .Values.api.tls.secretName }}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "ella-mocn.fullname" . }}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
